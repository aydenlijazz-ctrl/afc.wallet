<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>afc.wallet — Corporate Website UI Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #000;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: rgba(73,79,223,0.3); color: #fff; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="KitBase.jsx"></script>
<script type="text/babel" src="NavBar.jsx"></script>
<script type="text/babel" src="HeroBand.jsx"></script>
<script type="text/babel" src="FeatureGrid.jsx"></script>
<script type="text/babel" src="PlanSection.jsx"></script>
<script type="text/babel" src="StatsBand.jsx"></script>
<script type="text/babel" src="FooterSection.jsx"></script>

<script type="text/babel">
function App() {
  const [page, setPage] = React.useState('home');
  const [signupOpen, setSignupOpen] = React.useState(false);

  const handleNav = (p) => {
    if (p === 'signup') {
      setSignupOpen(true);
    } else if (p === 'login') {
      setSignupOpen(true);
    } else {
      setPage(p);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  return React.createElement(React.Fragment, null,
    React.createElement(NavBar, { currentPage: page, onNavigate: handleNav }),

    /* HOME page */
    page === 'home' && React.createElement(React.Fragment, null,
      React.createElement(HeroBand, {
        headline: 'Your money, simplified',
        subline: 'One account for spending, saving, investing, and managing your finances across borders.',
        primaryCta: 'Get started',
        secondaryCta: 'Compare plans',
        onPrimary: () => setSignupOpen(true),
        onSecondary: () => {
          document.getElementById('plans')?.scrollIntoView?.call(null) ||
          window.scrollTo({ top: document.getElementById('plans')?.offsetTop - 64, behavior: 'smooth' });
        },
      }),
      React.createElement(StatsBand),
      React.createElement(FeatureGrid, {
        title: 'Everything you need',
        subtitle: 'A full suite of financial tools in one beautifully simple app.',
      }),
      React.createElement('div', { id: 'plans' },
        React.createElement(PlanSection, {
          onSelect: (name) => { setSignupOpen(true); },
        }),
      ),
      React.createElement(DownloadBand),
    ),

    /* BUSINESS page */
    page === 'business' && React.createElement(React.Fragment, null,
      React.createElement(HeroBand, {
        headline: 'Business without borders',
        subline: 'Manage expenses, send invoices, and pay suppliers in 30+ currencies with zero hidden fees.',
        primaryCta: 'Open business account',
        onPrimary: () => setSignupOpen(true),
      }),
      React.createElement(FeatureGrid, {
        title: 'Built for business',
        subtitle: 'Tools that scale with your company.',
        features: [
          { title: 'Multi-user access', desc: 'Add team members with customisable spending permissions.' },
          { title: 'Expense management', desc: 'Automate receipt capture and categorise spending instantly.' },
          { title: 'Batch payments', desc: 'Pay hundreds of suppliers in one click across currencies.' },
          { title: 'API integrations', desc: 'Connect with your existing accounting and ERP software.' },
          { title: 'Corporate cards', desc: 'Issue physical and virtual cards with per-card spending limits.' },
          { title: 'Analytics dashboard', desc: 'Real-time spend analytics with custom reporting views.' },
        ],
      }),
      React.createElement(DownloadBand),
    ),

    /* COMPANY page */
    page === 'company' && React.createElement(React.Fragment, null,
      React.createElement(HeroBand, {
        headline: 'About afc.wallet',
        subline: 'We are building the world\'s first truly global financial superapp. Fair, fast, and transparent.',
        primaryCta: 'Join our team',
        secondaryCta: 'Read our story',
        onPrimary: () => setSignupOpen(true),
      }),
      React.createElement('section', {
        style: {
          background: '#fff', padding: '88px 32px',
        },
      },
        React.createElement('div', {
          style: { maxWidth: 720, margin: '0 auto' },
        },
          React.createElement('h2', {
            style: {
              fontFamily: kitStyles.fontDisplay, fontSize: 48, fontWeight: 500,
              lineHeight: 1.21, letterSpacing: '-0.48px', color: '#191c1f',
              marginBottom: 24,
            },
          }, 'Our mission'),
          React.createElement('p', {
            style: {
              fontFamily: kitStyles.fontBody, fontSize: 18, fontWeight: 400,
              lineHeight: 1.56, letterSpacing: '-0.09px', color: '#505a63',
              marginBottom: 24,
            },
          }, 'We believe everyone deserves access to fast, fair, and transparent financial services. No hidden fees. No unnecessary complexity. Just the tools you need to manage your money with confidence.'),
          React.createElement('p', {
            style: {
              fontFamily: kitStyles.fontBody, fontSize: 18, fontWeight: 400,
              lineHeight: 1.56, letterSpacing: '-0.09px', color: '#505a63',
            },
          }, 'Founded with the goal of eliminating the barriers in global finance, afc.wallet serves over 70 million customers across 150+ countries, processing billions in transactions every month.'),
        ),
      ),
      React.createElement(StatsBand),
    ),

    React.createElement(FooterSection),
    React.createElement(SignupModal, { open: signupOpen, onClose: () => setSignupOpen(false) }),
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
