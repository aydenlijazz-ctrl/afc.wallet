<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #000; padding: 0; display: flex; flex-direction: column; min-height: 100vh; justify-content: flex-end; }
  .footer {
    background: #000; padding: 40px 24px 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .footer-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 32px; max-width: 700px;
  }
  .footer-col h4 {
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    color: #fff; margin-bottom: 12px; line-height: 1.43;
  }
  .footer-col a {
    display: block;
    font-family: var(--font-body); font-size: 13px; font-weight: 400;
    color: rgba(255,255,255,0.72); text-decoration: none;
    line-height: 1.4; margin-bottom: 6px;
    transition: color 0.2s ease;
  }
  .footer-col a:hover { color: #fff; }
  .footer-bottom {
    margin-top: 24px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-family: var(--font-body); font-size: 13px; font-weight: 400;
    color: rgba(255,255,255,0.5); line-height: 1.4;
  }
</style>
</head>
<body>
  <footer class="footer">
    <div class="footer-grid">
      <div class="footer-col">
        <h4>Products</h4>
        <a href="#">Accounts</a>
        <a href="#">Cards</a>
        <a href="#">Transfers</a>
      </div>
      <div class="footer-col">
        <h4>Company</h4>
        <a href="#">About</a>
        <a href="#">Careers</a>
        <a href="#">Press</a>
      </div>
      <div class="footer-col">
        <h4>Support</h4>
        <a href="#">Help centre</a>
        <a href="#">Contact</a>
        <a href="#">Security</a>
      </div>
      <div class="footer-col">
        <h4>Legal</h4>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Cookies</a>
      </div>
    </div>
    <div class="footer-bottom">
      © 2026 afc.wallet. All rights reserved.
    </div>
  </footer>
</body>
</html>
