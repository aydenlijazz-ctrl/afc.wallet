<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #000; padding: 24px 28px; display: flex; flex-direction: column; justify-content: center; gap: 8px; min-height: 100vh; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .sample {
    font-family: var(--font-display);
    font-weight: 500;
    color: #fff;
    line-height: 1.0;
    white-space: nowrap;
  }
  .meta {
    font-family: var(--font-body); font-size: 11px; color: var(--color-stone);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="row">
    <span class="sample" style="font-size: 56px; letter-spacing: -1.12px;">Wallet</span>
    <span class="meta">display-xxl · 136px / -2.72ls</span>
  </div>
  <div class="row">
    <span class="sample" style="font-size: 40px; letter-spacing: -0.4px;">Banking & Beyond</span>
    <span class="meta">display-xl · 80px / -0.8ls</span>
  </div>
  <div class="row">
    <span class="sample" style="font-size: 28px; letter-spacing: -0.28px;">Your money, simplified</span>
    <span class="meta">display-lg · 48px / -0.48ls</span>
  </div>
  <div class="row">
    <span class="sample" style="font-size: 24px; letter-spacing: -0.24px;">Feature highlights</span>
    <span class="meta">display-md · 40px / -0.4ls</span>
  </div>
</body>
</html>
