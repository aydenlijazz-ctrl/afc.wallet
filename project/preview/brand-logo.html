<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #000; padding: 24px 28px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .logo-row {
    display: flex; align-items: center; gap: 32px;
  }
  .mark {
    width: 48px; height: 48px; background: #494fdf; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 28px; height: 28px; }
  .wordmark {
    font-family: var(--font-display); font-weight: 500;
    letter-spacing: -0.72px; color: #fff;
  }
  .wordmark.lg { font-size: 36px; }
  .wordmark.sm { font-size: 20px; color: rgba(255,255,255,0.72); }
  .divider { width: 1px; height: 48px; background: rgba(255,255,255,0.12); }
</style>
</head>
<body>
  <div class="logo-row">
    <div class="mark">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 14L16 34L24 20L32 34L38 14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="wordmark lg">afc.wallet</span>
    <div class="divider"></div>
    <span class="wordmark sm">afc.wallet</span>
  </div>
</body>
</html>
