<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fff; padding: 24px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 100vh; }
  .input-wrap {
    width: 320px; position: relative;
  }
  input {
    width: 100%; height: 56px;
    background: #fff; color: #191c1f;
    border: 1px solid #e2e2e7;
    border-radius: 12px;
    padding: 14px 16px;
    font-family: var(--font-body);
    font-size: 16px; font-weight: 400;
    letter-spacing: 0.24px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.2s ease;
  }
  input:focus { border-color: #494fdf; }
  input::placeholder { color: #8d969e; }
  .label {
    font-family: var(--font-body); font-size: 10px; color: var(--color-stone);
    text-align: center; margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="input-wrap">
    <input type="email" placeholder="Enter your email" value="">
  </div>
  <div class="label">text-input · 56px height · 12px radius · focus: primary border</div>
</body>
</html>
