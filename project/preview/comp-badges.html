<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #f4f4f4; padding: 24px 28px; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 100vh; }
  .badge {
    display: inline-flex; align-items: center;
    font-family: var(--font-body);
    font-size: 13px; font-weight: 400;
    line-height: 1.4;
    border-radius: 9999px;
    padding: 4px 12px;
  }
  .tag { background: #f4f4f4; color: #191c1f; border: 1px solid #e2e2e7; }
  .feature { background: #494fdf; color: #fff; }
  .pill-sm {
    display: inline-flex; align-items: center;
    font-family: var(--font-body);
    font-size: 14px; font-weight: 600;
    line-height: 1.43;
    border-radius: 9999px;
    padding: 8px 16px;
    height: 36px;
    background: #f4f4f4; color: #191c1f;
    border: none; cursor: pointer;
  }
  .label {
    font-family: var(--font-body); font-size: 10px; color: var(--color-stone);
    text-align: center; margin-top: 4px;
  }
  .col { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div class="col">
    <span class="badge tag">Transfers</span>
    <div class="label">badge-tag</div>
  </div>
  <div class="col">
    <span class="badge feature">Most popular</span>
    <div class="label">badge-feature</div>
  </div>
  <div class="col">
    <button class="pill-sm">Personal</button>
    <div class="label">button-pill-sm</div>
  </div>
</body>
</html>
