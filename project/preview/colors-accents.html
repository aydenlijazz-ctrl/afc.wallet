<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #060F1E;
    padding: 20px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .swatch {
    width: 100%; height: 68px; border-radius: 10px;
    display: flex; align-items: flex-end; padding: 8px 10px;
  }
  .swatch span { font-size: 10px; font-weight: 600; line-height: 1.2; color: rgba(255,255,255,0.85); }
  .swatch.light span { color: rgba(0,0,0,0.5); }
  .label { font-size: 10px; font-weight: 600; color: #9EA5E9; text-align: center; }
  .hex { font-size: 9px; color: #64748B; text-align: center; }
</style>
</head>
<body>
  <div class="col">
    <div class="swatch" style="background: #22C55E;"><span>Success</span></div>
    <div class="label">Успех</div>
    <div class="hex">#22C55E</div>
  </div>
  <div class="col">
    <div class="swatch" style="background: #EF4444;"><span>Error</span></div>
    <div class="label">Ошибка</div>
    <div class="hex">#EF4444</div>
  </div>
  <div class="col">
    <div class="swatch" style="background: #D4AF37;"><span>Gold</span></div>
    <div class="label">Золотой</div>
    <div class="hex">#D4AF37</div>
  </div>
  <div class="col">
    <div class="swatch" style="background: #818CF8;"><span>Purple</span></div>
    <div class="label">Фиолетовый</div>
    <div class="hex">#818CF8</div>
  </div>
  <div class="col">
    <div class="swatch" style="background: #64748B;"><span>Text Gray</span></div>
    <div class="label">Текст серый</div>
    <div class="hex">#64748B</div>
  </div>
  <div class="col">
    <div class="swatch" style="background: #94A3B8;"><span>Text Muted</span></div>
    <div class="label">Текст мутный</div>
    <div class="hex">#94A3B8</div>
  </div>
</body>
</html>
