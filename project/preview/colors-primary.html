<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #060F1E;
    padding: 20px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
  }
  .swatch {
    width: 100%;
    height: 72px;
    border-radius: 10px;
    display: flex;
    align-items: flex-end;
    padding: 8px 10px;
  }
  .swatch span {
    font-size: 10px;
    font-weight: 600;
    line-height: 1.2;
    color: rgba(255,255,255,0.85);
  }
  .swatch.light-text span {
    color: rgba(0,0,0,0.5);
  }
  .label {
    font-size: 10px;
    font-weight: 600;
    color: #9EA5E9;
    text-align: center;
  }
  .hex {
    font-size: 9px;
    color: #64748B;
    text-align: center;
    font-family: 'Inter', monospace;
  }
</style>
</head>
<body>
  <div class="col">
    <div class="swatch" style="background: #1E3A8A;"><span>#1E3A8A</span></div>
    <div class="label">Синий глубокий</div>
    <div class="hex">Deep Blue</div>
  </div>
  <div class="col">
    <div class="swatch" style="background: #1D4ED8;"><span>#1D4ED8</span></div>
    <div class="label">Синий тёмный</div>
    <div class="hex">Dark Blue</div>
  </div>
  <div class="col">
    <div class="swatch" style="background: #2563EB;"><span>#2563EB</span></div>
    <div class="label">Основной синий</div>
    <div class="hex">Primary Blue</div>
  </div>
  <div class="col">
    <div class="swatch" style="background: #3BBDF8;"><span>#3BBDF8</span></div>
    <div class="label">Голубой акцент</div>
    <div class="hex">Blue Accent</div>
  </div>
  <div class="col">
    <div class="swatch" style="background: #9EA5E9;"><span>#9EA5E9</span></div>
    <div class="label">Голубой тёмный</div>
    <div class="hex">Muted Blue</div>
  </div>
  <div class="col">
    <div class="swatch light-text" style="background: #BFDBFE;"><span>#BFDBFE</span></div>
    <div class="label">Голубой светлый</div>
    <div class="hex">Light Blue</div>
  </div>
</body>
</html>
